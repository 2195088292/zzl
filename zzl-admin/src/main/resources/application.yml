# 项目相关配置
zzl:
  # 名称
  name: Zzl
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/zzl/uploadPath，Linux配置 /home/zzl/uploadPath）
  profile: D:/zzl/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  # AI 管理助手。全局开关开启；未配置可用模型时自动回退本地摘要。
  ai:
    enabled: true
    default-model: ollama
    rag:
      # 可选本机 OCR。启用前安装 Tesseract 及 chi_sim/eng 语言包。
      ocr:
        enabled: false
        command: tesseract
        languages: chi_sim+eng
      embedding:
        enabled: true
        # local：本地词法向量；openai：远端失败报告错误，避免同一索引混入不同向量空间。
        provider: local
        endpoint: https://api.openai.com/v1/embeddings
        api-key: ${OPENAI_API_KEY:}
        model: text-embedding-3-small
        dimension: 96
        timeout-ms: 2500
      # 可选外部向量库。mysql 保持零依赖；qdrant 启用后写入/召回失败自动回退 MySQL JSON。
      vector-store:
        provider: mysql
        enabled: false
        base-url: http://localhost:6333
        api-key: ${QDRANT_API_KEY:}
        collection: zzl_ai_chunks
        auto-create: true
        timeout-ms: 1800
        search-limit: 40
    # 默认只保留本地 Ollama；第三方模型从“模型管理”运行时添加。
    models:
      ollama:
        label: Ollama 本地模型
        base-url: http://localhost:11434/v1
        api-key: ollama
        model-name: qwen2.5:7b
        temperature: 0.2
        max-tokens: 1200

# 开发环境配置
  social:
    frontend-url: http://localhost:8081
    default-redirect: /index
    auto-register: true
    providers:
      qq:
        name: QQ
        source: QQ
        enabled: false
        client-id:
        client-secret:
        redirect-uri: http://localhost:8080/auth/social/qq/callback
      wechat:
        name: WeChat
        source: WECHAT_OPEN
        enabled: false
        client-id:
        client-secret:
        redirect-uri: http://localhost:8080/auth/social/wechat/callback
      github:
        name: GitHub
        source: GITHUB
        enabled: false
        client-id:
        client-secret:
        redirect-uri: http://localhost:8080/auth/social/github/callback
      gitee:
        name: Gitee
        source: GITEE
        enabled: false
        client-id:
        client-secret:
        redirect-uri: http://localhost:8080/auth/social/gitee/callback
      google:
        name: Google
        source: GOOGLE
        enabled: false
        client-id:
        client-secret:
        redirect-uri: http://localhost:8080/auth/social/google/callback
      facebook:
        name: Facebook
        source: FACEBOOK
        enabled: false
        client-id:
        client-secret:
        redirect-uri: http://localhost:8080/auth/social/facebook/callback

server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.zzl: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 20MB
      # 设置总上传的文件大小
      max-request-size: 25MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.zzl.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.zzl.web.controller.tool,com.zzl.**.controller

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,zzl.local

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
