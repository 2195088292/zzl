<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="/favicon.ico">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      gap: 18px;
      padding: 28px;
      overflow: hidden;
      color: #17151f;
      background:
        radial-gradient(circle at 24% 24%, rgba(255, 156, 93, 0.24), transparent 28%),
        radial-gradient(circle at 76% 68%, rgba(109, 77, 247, 0.2), transparent 30%),
        linear-gradient(90deg, rgba(109, 77, 247, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(109, 77, 247, 0.08) 1px, transparent 1px),
        #fffefb;
      background-size: auto, auto, 54px 54px, 54px 54px, auto;
    }

    #loader-wrapper::before {
      content: '';
      position: absolute;
      width: min(72vw, 520px);
      height: min(72vw, 520px);
      border-radius: 38% 62% 47% 53% / 42% 38% 62% 58%;
      background: rgba(255, 255, 255, 0.56);
      box-shadow: 0 28px 90px rgba(23, 21, 31, 0.08);
      animation: blobBreathe 5.2s ease-in-out infinite;
    }

    .boot-loader-scene {
      position: absolute;
      z-index: 1;
      width: 168px;
      height: 168px;
      perspective: 760px;
      transform-style: preserve-3d;
    }

    .boot-loader-cube {
      position: absolute;
      inset: 48px;
      transform-style: preserve-3d;
      animation: loaderCubeSpin 1.65s cubic-bezier(0.55, 0, 0.24, 1) infinite;
    }

    .boot-cube-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border: 2px solid rgba(23, 21, 31, 0.08);
      border-radius: 8px;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(135deg, #6d4df7, #ff9c5d);
      box-shadow: 0 18px 42px rgba(109, 77, 247, 0.2);
    }

    .boot-face-front {
      transform: translateZ(36px);
    }

    .boot-face-back {
      transform: rotateY(180deg) translateZ(36px);
    }

    .boot-face-right {
      transform: rotateY(90deg) translateZ(36px);
      background: #f7de3f;
    }

    .boot-face-left {
      transform: rotateY(-90deg) translateZ(36px);
      background: #ff9c5d;
    }

    .boot-face-top {
      transform: rotateX(90deg) translateZ(36px);
      background: #6d4df7;
    }

    .boot-face-bottom {
      transform: rotateX(-90deg) translateZ(36px);
      background: #17151f;
    }

    .boot-loader-orbit {
      position: absolute;
      inset: 18px;
      border: 2px solid rgba(109, 77, 247, 0.18);
      border-radius: 50%;
      transform-style: preserve-3d;
    }

    .boot-orbit-a {
      animation: orbitA 1.5s linear infinite;
    }

    .boot-orbit-b {
      inset: 28px;
      border-color: rgba(255, 156, 93, 0.28);
      animation: orbitB 1.9s linear infinite;
    }

    .boot-loader-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: 0 10px 22px rgba(23, 21, 31, 0.12);
    }

    .boot-dot-a {
      left: 16px;
      top: 54px;
      background: #6d4df7;
      animation: dotFloat 1.2s ease-in-out infinite;
    }

    .boot-dot-b {
      right: 18px;
      top: 76px;
      background: #ff9c5d;
      animation: dotFloat 1.4s ease-in-out 0.18s infinite;
    }

    .boot-dot-c {
      left: 74px;
      bottom: 12px;
      background: #f7de3f;
      animation: dotFloat 1.55s ease-in-out 0.32s infinite;
    }

    #loader-wrapper .load_title {
      position: relative;
      z-index: 1;
      margin: 172px 0 0;
      color: #17151f;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0;
      text-align: center;
    }

    @keyframes loaderCubeSpin {
      0% {
        transform: rotateX(-18deg) rotateY(0deg) rotateZ(0deg);
      }

      50% {
        transform: rotateX(18deg) rotateY(180deg) rotateZ(8deg);
      }

      100% {
        transform: rotateX(-18deg) rotateY(360deg) rotateZ(0deg);
      }
    }

    @keyframes orbitA {
      from {
        transform: rotateX(64deg) rotateZ(0deg);
      }

      to {
        transform: rotateX(64deg) rotateZ(360deg);
      }
    }

    @keyframes orbitB {
      from {
        transform: rotateY(62deg) rotateZ(0deg);
      }

      to {
        transform: rotateY(62deg) rotateZ(-360deg);
      }
    }

    @keyframes dotFloat {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-10px) scale(1.12);
      }
    }

    @keyframes blobBreathe {

      0%,
      100% {
        transform: scale(1) rotate(0deg);
      }

      50% {
        transform: scale(1.05) rotate(6deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .boot-loader-cube,
      .boot-loader-orbit,
      .boot-loader-dot,
      #loader-wrapper::before {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper" role="status" aria-live="polite">
      <div class="boot-loader-scene" aria-hidden="true">
        <div class="boot-loader-orbit boot-orbit-a"></div>
        <div class="boot-loader-orbit boot-orbit-b"></div>
        <div class="boot-loader-cube">
          <span class="boot-cube-face boot-face-front">Z</span>
          <span class="boot-cube-face boot-face-back">Z</span>
          <span class="boot-cube-face boot-face-right"></span>
          <span class="boot-cube-face boot-face-left"></span>
          <span class="boot-cube-face boot-face-top"></span>
          <span class="boot-cube-face boot-face-bottom"></span>
        </div>
        <span class="boot-loader-dot boot-dot-a"></span>
        <span class="boot-loader-dot boot-dot-b"></span>
        <span class="boot-loader-dot boot-dot-c"></span>
      </div>
      <div class="load_title">Loading Zzl...</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
