<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="/favicon.ico">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      background: rgba(248, 250, 252, 0.9);
      backdrop-filter: blur(10px);
    }

    .boot-loader-3d {
      position: relative;
      width: 150px;
      height: 150px;
      perspective: 680px;
      transform-style: preserve-3d;
      animation: boot-loader-float 3.2s ease-in-out infinite;
    }

    .boot-loader-glow {
      position: absolute;
      inset: 34px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.22);
      filter: blur(18px);
      transform: translateZ(-20px);
    }

    .boot-loader-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 42% 58% 55% 45%;
      background: radial-gradient(circle at 30% 24%, #ffffff 0 9%, #c7d2fe 25%, #818cf8 58%, #4338ca 100%);
      box-shadow: 0 18px 36px rgba(67, 56, 202, 0.28), inset -7px -9px 12px rgba(30, 27, 75, 0.18);
      transform: translate(-50%, -50%) translateZ(22px) rotate(-12deg);
      animation: boot-core-breathe 2.4s ease-in-out infinite;
    }

    .boot-loader-ring {
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(99, 102, 241, 0.42);
      border-radius: 50%;
      transform-style: preserve-3d;
    }

    .boot-ring-a {
      transform: rotateX(66deg) rotateZ(12deg);
      animation: boot-ring-a-spin 2.8s linear infinite;
    }

    .boot-ring-b {
      inset: 32px;
      border-color: rgba(14, 165, 233, 0.38);
      transform: rotateY(68deg) rotateZ(-18deg);
      animation: boot-ring-b-spin 2.2s linear infinite reverse;
    }

    .boot-loader-satellite {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 9px;
      height: 9px;
      margin: -4.5px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
      transform-style: preserve-3d;
    }

    .boot-satellite-a {
      background: #38bdf8;
      animation: boot-satellite-a-spin 2.8s linear infinite;
    }

    .boot-satellite-b {
      background: #fbbf24;
      animation: boot-satellite-b-spin 2.2s linear infinite reverse;
    }

    @keyframes boot-loader-float {
      0%,
      100% { transform: translateY(0) rotateX(0deg); }
      50% { transform: translateY(-5px) rotateX(4deg); }
    }

    @keyframes boot-core-breathe {
      0%,
      100% { transform: translate(-50%, -50%) translateZ(22px) rotate(-12deg) scale(0.96); }
      50% { transform: translate(-50%, -50%) translateZ(32px) rotate(8deg) scale(1.06); }
    }

    @keyframes boot-ring-a-spin {
      from { transform: rotateX(66deg) rotateZ(12deg); }
      to { transform: rotateX(66deg) rotateZ(372deg); }
    }

    @keyframes boot-ring-b-spin {
      from { transform: rotateY(68deg) rotateZ(-18deg); }
      to { transform: rotateY(68deg) rotateZ(-378deg); }
    }

    @keyframes boot-satellite-a-spin {
      from { transform: rotateZ(0deg) translateX(52px) rotateZ(0deg); }
      to { transform: rotateZ(360deg) translateX(52px) rotateZ(-360deg); }
    }

    @keyframes boot-satellite-b-spin {
      from { transform: rotateY(0deg) translateX(43px) rotateY(0deg); }
      to { transform: rotateY(360deg) translateX(43px) rotateY(-360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-loader-3d,
      .boot-loader-core,
      .boot-loader-ring,
      .boot-loader-satellite {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper" role="status" aria-live="polite" aria-label="正在载入页面">
      <div class="boot-loader-3d" aria-hidden="true">
        <div class="boot-loader-glow"></div>
        <div class="boot-loader-core"></div>
        <div class="boot-loader-ring boot-ring-a"></div>
        <div class="boot-loader-ring boot-ring-b"></div>
        <span class="boot-loader-satellite boot-satellite-a"></span>
        <span class="boot-loader-satellite boot-satellite-b"></span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
